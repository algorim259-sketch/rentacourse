<meta name="color-scheme" content="dark">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* ============ COULEURS ============ */
:root {
  --bg: #1e2124; --card: #2a2e33; --card2: #33383e; --line: #3d434a;
  --text: #e8eaed; --muted: #a3aab2; --accent: #82aad6; --accent-ink: #10202f;
  --accent-soft: rgba(130,170,214,.14);
  --warn-bg: #4a3910; --warn-line: #f0b84a; --warn-text: #ffe4a8;
  --danger: #e59a90;
  color-scheme: dark;
}
/* Mode nuit : très sombre, couleurs chaudes */
:root[data-night="1"] {
  --bg: #0a0706; --card: #140f0c; --card2: #1b1410; --line: #2a1f18;
  --text: #a8815f; --muted: #6f5743; --accent: #a8743f; --accent-ink: #0a0706;
  --accent-soft: rgba(168,116,63,.14);
  --warn-bg: #241507; --warn-line: #8a5a22; --warn-text: #c4925a;
  --danger: #8f5a4e;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
main {
  max-width: 560px; margin: 0 auto;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 190px max(16px, env(safe-area-inset-left));
  display: flex; flex-direction: column; gap: 28px;
}
h1 { font-size: 26px; line-height: 1.2; margin: 0; font-weight: 650; }
h2 { font-size: 20px; margin: 0 0 12px; font-weight: 650; }
h3 { font-size: 17px; margin: 0; font-weight: 650; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.card { background: var(--card); border-radius: 18px; padding: 18px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
ul { list-style: none; margin: 0; padding: 0; }

/* ============ EN-TÊTE ============ */
.head { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px;
  padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); font-size: 16px; font-weight: 600;
}
.chip.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.typerow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.weather { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: var(--card); border: 0; border-radius: 18px; padding: 14px 18px; }
.weather .ico { font-size: 34px; line-height: 1; }
.weather b { font-size: 24px; font-weight: 650; }

/* ============ BOUTONS ============ */
.btn {
  min-height: 52px; padding: 12px 18px; border-radius: 14px; border: 0;
  background: var(--card2); font-weight: 600; font-size: 17px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.block { width: 100%; }
.btn.danger { color: var(--danger); background: transparent; border: 1px solid var(--line); }
.btn:disabled { opacity: .45; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 12px 0; min-height: 48px; }
.icon {
  width: 48px; height: 48px; flex: none; border: 0; border-radius: 12px; background: transparent;
  display: grid; place-items: center; color: var(--muted);
}
.icon svg { width: 22px; height: 22px; }
svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ============ LISTES / TÂCHES ============ */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 4px; background: var(--card); border-radius: 16px; padding: 4px 4px 4px 6px; min-height: 64px; }
.card .item { background: var(--card2); }
.check {
  width: 52px; height: 52px; flex: none; border: 0; background: transparent; display: grid; place-items: center;
}
.check span {
  width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--muted); display: grid; place-items: center;
}
.check svg { width: 20px; height: 20px; stroke-width: 3; opacity: 0; }
.check[aria-pressed="true"] span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check[aria-pressed="true"] svg { opacity: 1; }
.ttext { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 10px 4px; display: flex; flex-direction: column; gap: 2px; }
.ttext > span { overflow-wrap: anywhere; }
.tag { font-size: 13px; color: var(--muted); }
.tag .dot { color: var(--accent); }
.item.done .ttext > span { color: var(--muted); text-decoration: line-through; }
.empty { color: var(--muted); padding: 14px 4px; }
.overdue { border: 1px solid var(--line); background: transparent; }
.lenbtn { flex: none; min-height: 40px; min-width: 64px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 14px; font-weight: 600; color: var(--muted); }
.lenbtn.long { color: var(--accent); border-color: var(--accent); }

/* ============ DEMAIN ============ */
.demain { border: 1px solid var(--line); }
.alert { background: var(--warn-bg); border: 2px solid var(--warn-line); color: var(--warn-text); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.alert strong { font-size: 20px; }
.alert .btn { background: var(--warn-line); color: #1d1404; }
:root[data-night="1"] .alert .btn { color: var(--bg); }

/* ============ OBJECTIFS ============ */
.bar { height: 10px; border-radius: 99px; background: var(--card2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.goalhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.next { background: var(--card2); border-radius: 14px; padding: 12px 14px; }
.next small { display: block; color: var(--muted); font-size: 13px; }

/* ============ HABITUDES ============ */
.item.wrap { flex-wrap: wrap; }
.counter { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 8px 12px 12px; }
.counter b { flex-basis: 100%; font-size: 16px; }
.counter button { flex: 1; min-width: 0; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: transparent; font-weight: 700; font-size: 16px; }
.counter .bar { flex-basis: 100%; }
textarea { width: 100%; min-height: 84px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); font: inherit; color: inherit; resize: vertical; }
textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.fieldlabel { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: -4px; }
.mrow .top { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; margin-bottom: 6px; }
.rule { padding: 10px 0; border-bottom: 1px solid var(--line); }
.rule:last-child { border-bottom: 0; }
.dots { display: flex; gap: 5px; flex: none; padding-right: 10px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); display: block; }
.dots i.on { background: var(--accent); border-color: var(--accent); }
.dots i.free { border-style: dashed; }

/* ============ IDÉES ============ */
.idea { display: flex; flex-direction: column; gap: 12px; }
.theme { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 700; }
.btns3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.btns3 .btn { padding: 10px 6px; font-size: 16px; }
.state { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); }

/* ============ RÉGLAGES ============ */
details { background: var(--card); border-radius: 16px; }
details + details { margin-top: 8px; }
summary { list-style: none; padding: 18px; min-height: 60px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "›"; font-size: 24px; color: var(--muted); transform: rotate(90deg); }
details[open] summary::after { transform: rotate(-90deg); }
details > .inner { padding: 0 14px 18px; display: flex; flex-direction: column; gap: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { min-height: 46px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: transparent; font-weight: 600; font-size: 16px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
input[type=text], input[type=number], input[type=date], input[type=time] {
  width: 100%; min-height: 54px; padding: 12px 14px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--bg); font-size: 17px;
}
input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.addrow { display: flex; gap: 8px; }
.addrow .btn { flex: 1; }
.dayrow { display: flex; flex-direction: column; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.dayrow:last-child { border-bottom: 0; }

/* ============ BOUTON + / FENÊTRES / MESSAGE ============ */
.fab {
  position: fixed; right: max(20px, env(safe-area-inset-right)); bottom: calc(86px + env(safe-area-inset-bottom));
  width: 68px; height: 68px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.45); z-index: 5;
}
.fab[hidden] { display: none; }
:root[data-night="1"] .fab { box-shadow: none; opacity: .8; }
.fab svg { width: 32px; height: 32px; stroke-width: 2.6; }
dialog {
  border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92vh;
  background: var(--card); color: var(--text); border-radius: 22px 22px 0 0;
}
dialog::backdrop { background: rgba(0,0,0,.6); }
.sheet { padding: 22px 18px max(22px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
.sheet label { font-size: 14px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 8px; }
.sheet .actions { display: flex; gap: 10px; }
.sheet .actions .btn { flex: 1; }
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 166px); transform: translateX(-50%);
  background: var(--card2); color: var(--text); border: 1px solid var(--line); border-radius: 999px;
  padding: 10px 10px 10px 20px; display: flex; align-items: center; gap: 6px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; max-width: calc(100% - 32px); white-space: nowrap;
}
.toast.show { opacity: 1; pointer-events: auto; }
.toast .linkbtn { padding: 6px 12px; min-height: 40px; }
.toast:not(.has-undo) { padding-right: 20px; }
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center;
  background: var(--card); border-top: 1px solid var(--line);
  padding: 4px max(4px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));
}
.tabs > div { display: flex; width: 100%; max-width: 560px; }
.tabs button {
  flex: 1; min-width: 0; min-height: 62px; border: 0; background: none; color: var(--muted); border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600;
}
.tabs button svg { width: 25px; height: 25px; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs[hidden] { display: none; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi { background: var(--card2); border-radius: 14px; padding: 12px; }
.kpi b { display: block; font-size: 20px; font-weight: 650; }
.kpi span { font-size: 13px; color: var(--muted); }
.bignum { font-size: 38px; font-weight: 700; line-height: 1.1; }
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.monthnav .icon { font-size: 26px; color: var(--text); background: var(--card2); }
.monthnav .icon:disabled { opacity: .3; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sbars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 130px; }
.sbars div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; font-size: 12px; color: var(--muted); }
.sbars i { display: block; width: 100%; max-width: 30px; border-radius: 8px 8px 3px 3px; background: var(--accent); min-height: 3px; }
.sbars i.warn { background: var(--warn-line); }
.sbars i.bad { background: var(--danger); }
.sbars i.none { background: var(--card2); }
.sbars b { font-size: 12px; color: var(--text); min-height: 16px; font-weight: 600; }
.ok-t { color: var(--accent); } .warn-t { color: var(--warn-line); } .bad-t { color: var(--danger); }
.linkcard { width: 100%; text-align: left; border: 0; color: inherit; display: flex; flex-direction: column; gap: 4px; }
.shabbat { text-align: center; padding: 48px 20px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.shabbat h2 { font-size: 34px; margin: 0; }
.warnbar { background: var(--warn-bg); color: var(--warn-text); border-radius: 14px; padding: 12px 14px; font-size: 15px; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>

function normalize(o) {

  for (const k of ['habitLog', 'ideas', 'generated', 'dayOverrides', 'recent', 'settings']) if (!s[k] || typeof s[k] !== 'object') s[k] = {};
  if (!s.settings.night) s.settings.night = 'auto';

  for (const k of ['earnings', 'sleep']) if (!s[k] || typeof s[k] !== 'object') s[k] = {};
  if (!s.skill || typeof s.skill !== 'object') s.skill = { start: null, offset: 0, done: {} };
  if (!s.skill.done) s.skill.done = {};

/* ---------- Type de journée & Shabbat ---------- */
function defaultType(s) { const w = wday(s); return w === 6 ? 'shabbat' : w === 5 ? 'vendredi' : (w === 1 || w === 3) ? 'conge' : 'travail'; }
function dayType(s) { return wday(s) === 6 ? 'shabbat' : (state.dayOverrides[s] || defaultType(s)); }
const lenFor = type => type === 'conge' ? 'long' : 'court';

// Coucher du soleil approximatif à Tel Aviv si la météo n'est pas encore chargée
const APPROX_SUNSET = [[16, 58], [17, 22], [17, 45], [19, 5], [19, 25], [19, 45], [19, 47], [19, 25], [18, 50], [17, 50], [16, 43], [16, 38]];
function sunset(s) {
  const iso = weather && weather.sunsets && weather.sunsets[s];
  if (iso) return new Date(iso);
  const d = parse(s), [h, m] = APPROX_SUNSET[d.getMonth()];
  d.setHours(h, m, 0, 0); return d;
}
const shabbatStart = s => new Date(sunset(s).getTime() - 20 * 60000); // allumage des bougies
const shabbatEnd = s => new Date(sunset(s).getTime() + 40 * 60000);   // fin de Shabbat
function shabbatNow(t) {
  const s = ymd(t), w = t.getDay();
  if (w === 5) return { active: t >= shabbatStart(s), end: shabbatEnd(addDays(s, 1)) };
  if (w === 6) return { active: t < shabbatEnd(s), end: shabbatEnd(s) };
  return { active: false };
}

/* ---------- Propositions automatiques ---------- */
function pick(theme, len, exclude = []) {
  const all = state.bank[theme] || [];
  const recent = state.recent[theme] || [];
  const tries = [
    x => x.len === len && !recent.includes(x.id) && !exclude.includes(x.id),
    x => x.len === len && !exclude.includes(x.id),
    x => !exclude.includes(x.id),
    () => true
  ];
  for (const f of tries) {
    const c = all.filter(f);
    if (c.length) {
      const it = c[Math.floor(Math.random() * c.length)];
      const r = recent.filter(id => id !== it.id); r.push(it.id);
      state.recent[theme] = r.slice(-Math.max(1, Math.floor(all.length / 2)));
      return it;
    }
  }
  return null;
}
function goalSuggestion(date, gid, type) {
  const goal = state.goals.find(g => g.id === gid);
  const t0 = todayStr();
  const busy = new Set(state.tasks.filter(t => t.stepId && !t.done && t.date >= t0).map(t => t.stepId));
  const want = lenFor(type);
  const step = goal && goal.steps.find(s => !s.done && !busy.has(s.id));
  if (step && (want === 'long' || step.len === 'court')) {
    state.tasks.push({ id: uid(), date, text: step.text, theme: gid, source: 'goal', goalId: gid, stepId: step.id, auto: true, done: false });
    return;
  }
  const it = pick(gid, want);
  if (it) state.tasks.push({ id: uid(), date, text: it.text, theme: gid, source: 'suggest', auto: true, done: false });
}
function generate(date) {
  const type = dayType(date);
  state.generated[date] = type;
  if (type === 'shabbat') return;
  goalSuggestion(date, 'rentacourse', type);
  goalSuggestion(date, 'dofus', type);
  const ideas = state.ideas[date] = state.ideas[date] || {};
  for (const th of IDEA_THEMES) {
    if (ideas[th]) continue;
    const it = pick(th, lenFor(type));
    if (it) ideas[th] = { id: it.id, text: it.text, status: 'pending' };
  }
}
// Génère une fois par jour, et regénère si le type de journée a changé
function refreshPlans(date) {
  const g = state.generated[date];
  if (g && g === dayType(date)) return;
  if (g) {
    state.tasks = state.tasks.filter(t => !(t.date === date && t.auto && !t.done));
    const ideas = state.ideas[date] || {};
    for (const th of Object.keys(ideas)) if (ideas[th].status === 'pending' && !ideas[th].moved) delete ideas[th];
  }
  generate(date);
}
function prune() {
  const lim = addDays(todayStr(), -60), lim2 = addDays(todayStr(), -14);
  state.tasks = state.tasks.filter(t => t.date >= lim || (!t.done && !t.auto));
  for (const k of Object.keys(state.ideas)) if (k < lim2) delete state.ideas[k];
  for (const k of Object.keys(state.generated)) if (k < lim2) delete state.generated[k];
  for (const k of Object.keys(state.dayOverrides)) if (k < lim2) delete state.dayOverrides[k];
  const lim3 = addDays(todayStr(), -400);
  for (const k of Object.keys(state.habitLog)) if (k < lim3) delete state.habitLog[k];
}

  95: ['⛈️', 'Orage'], 96: ['⛈️', 'Orage et grêle'], 99: ['⛈️', 'Orage et grêle']

const RAIN_CODES = new Set([53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99]);
let weatherLoading = false, weatherError = false;
async function fetchWeather(force) {
  if (weatherLoading) return;
  if (!force && weather && Date.now() - weather.fetchedAt < 30 * 60000) return;
  if (navigator.onLine === false) { if (!weatherError) { weatherError = true; render(); } return; }
  weatherLoading = true;
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
    '&current=temperature_2m,weather_code' +
    '&hourly=precipitation_probability,precipitation' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunset' +
    '&timezone=Asia%2FJerusalem&forecast_days=8';
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const sunsets = Object.assign({}, weather && weather.sunsets);
    j.daily.time.forEach((d, i) => { if (j.daily.sunset[i]) sunsets[d] = j.daily.sunset[i]; });
    for (const k of Object.keys(sunsets)) if (k < addDays(todayStr(), -7)) delete sunsets[k];
    weather = { fetchedAt: Date.now(), current: j.current, daily: j.daily, hourly: j.hourly, sunsets };
    try { localStorage.setItem(WKEY, JSON.stringify(weather)); } catch (e) { }
    weatherError = false;
  } catch (e) { weatherError = true; }
  weatherLoading = false;
  render();
}
function wFor(date) {
  if (!weather || !weather.daily) return null;
  const i = weather.daily.time.indexOf(date);
  if (i < 0) return null;
  const d = weather.daily;
  return { code: d.weather_code[i], max: d.temperature_2m_max[i], min: d.temperature_2m_min[i], pmax: d.precipitation_probability_max[i] || 0, psum: d.precipitation_sum[i] || 0 };
}
function rainFor(date) {
  const w = wFor(date); if (!w) return null;
  const hours = [];
  const h = weather.hourly;
  if (h && h.time) h.time.forEach((t, i) => {
    if (!t.startsWith(date)) return;
    const hr = +t.slice(11, 13);
    if (hr >= 8 && hr <= 21 && ((h.precipitation_probability[i] || 0) >= 45 || (h.precipitation[i] || 0) >= 0.3)) hours.push(hr);
  });
  const heavy = RAIN_CODES.has(w.code) || w.pmax >= 50 || w.psum >= 1;
  const light = !heavy && w.pmax >= 25;
  let when = '';
  if (hours.length) when = hours.length > 10 ? 'Presque toute la journée' : 'Surtout entre ' + hours[0] + 'h et ' + (hours[hours.length - 1] + 1) + 'h';
  return { heavy, light, pmax: w.pmax, psum: w.psum, when };
}
function weatherLine(date, withCurrent) {
  const w = wFor(date);
  if (!w) return '<span class="muted small">' + (weatherLoading ? 'Météo en cours de chargement…' : weatherError ? 'Météo indisponible (pas de connexion)' : 'Météo pas encore chargée') + '</span>';
  const [ico, label] = WMO[w.code] || ['🌡️', 'Météo'];
  const cur = withCurrent && weather.current && Date.now() - weather.fetchedAt < 3 * 3600000 ? Math.round(weather.current.temperature_2m) : Math.round(w.max);
  return '<span class="ico" aria-hidden="true">' + ico + '</span><span><b>' + cur + '°</b> <span>' + esc(label) + '</span><br><span class="muted small">Min ' + Math.round(w.min) + '° · Max ' + Math.round(w.max) + '°' + (w.pmax >= 20 ? ' · Pluie ' + w.pmax + ' %' : '') + '</span></span>';
}

  if (undone) h += '<button class="btn ghost block" style="margin-top:10px" data-act="postponeAll">Reporter les ' + undone + ' non faites à ' + (tom === addDays(today, 1) ? 'demain' : dayName(tom).toLowerCase()) + '</button>';

    if (ui.showTomorrow) h += demainHTML(tom);
  }
  return h + '</section>';
}

function countOf(date, hid) { return +((state.counts[date] || {})[hid]) || 0; }
function isDone(date, hid) { return !!(state.habitLog[date] && state.habitLog[date][hid]); }
function streak(hid, today) {
  let n = 0, d = today;
  for (let i = 0; i < 400; i++) {
    const w = wday(d);
    if (isDone(d, hid)) n++;
    else if (!(i === 0 || w === 5 || w === 6)) break; // vendredi, samedi et aujourd'hui ne cassent pas la série
    d = addDays(d, -1);
  }
  return n;
}
function habitsHTML(today) {
  let h = '<section id="habitudes"><h2>Mes habitudes</h2><ul class="list">';
  for (const hb of state.habits) {
    const done = isDone(today, hb.id), s = streak(hb.id, today);
    let dots = '';
    for (let i = 6; i >= 0; i--) {
      const d = addDays(today, -i), w = wday(d);
      dots += '<i class="' + (isDone(d, hb.id) ? 'on' : (w === 5 || w === 6) ? 'free' : '') + '" title="' + dayName(d) + '"></i>';
    }
    const cnt = hb.goal ? countOf(today, hb.id) : 0;
    h += '<li class="item' + (hb.goal ? ' wrap' : '') + '">' +
      '<button class="check" data-act="toggleHabit" data-id="' + hb.id + '" aria-pressed="' + done + '" aria-label="' + esc(hb.name) + ' fait aujourd’hui"><span>' + I.check + '</span></button>' +
      '<div class="ttext" style="padding:10px 4px"><span>' + esc(hb.name) + '</span><small class="tag">' + (s ? 'Série : ' + s + ' jour' + (s > 1 ? 's' : '') : 'Pas encore de série') + '</small></div>' +
      '<div class="dots" aria-hidden="true">' + dots + '</div>' +
      (hb.goal ? '<div class="counter"><b>' + cnt + ' / ' + hb.goal + ' aujourd’hui' + (cnt >= hb.goal ? ' ✓' : '') + '</b>' +
        [1, 5, 10, 20].map(n => '<button data-act="addCount" data-id="' + hb.id + '" data-n="' + n + '">+' + n + '</button>').join('') +
        '<button data-act="addCount" data-id="' + hb.id + '" data-n="-1" aria-label="Retirer 1">−1</button>' +
        '<div class="bar"><i style="width:' + Math.min(100, Math.round(cnt / hb.goal * 100)) + '%"></i></div></div>' : '') +
      '</li>';
  }
  if (!state.habits.length) h += '<li class="empty">Aucune habitude. Ajoute-en dans les réglages.</li>';
  return h + '</ul><p class="small muted" style="margin-top:8px">Le vendredi et le samedi ne cassent jamais la série.</p></section>';
}

/* ---------- Gains ---------- */
const money = n => (Math.round(n * 100) / 100).toLocaleString('fr-FR') + ' ₪';
const monthLabel = m => cap(new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }));
const addMonths = (m, n) => { const d = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const num = v => { const x = parseFloat(String(v).replace(',', '.')); return isNaN(x) ? null : x; };
function monthStats(m) {
  const l = Object.entries(state.earnings).filter(([d, e]) => d.startsWith(m) && e && e.amount > 0).sort((a, b) => b[0] < a[0] ? -1 : 1);
  const total = l.reduce((a, [, e]) => a + e.amount, 0);
  const withH = l.filter(([, e]) => e.hours > 0);
  const hours = withH.reduce((a, [, e]) => a + e.hours, 0), hTotal = withH.reduce((a, [, e]) => a + e.amount, 0);
  const best = l.reduce((b, x) => !b || x[1].amount > b[1].amount ? x : b, null);
  return { l, total, days: l.length, avg: l.length ? total / l.length : 0, best, perHour: hours ? hTotal / hours : 0, hours };
}
function gainSheet(date, fresh) {
  const e = fresh ? null : state.earnings[date];
  sheet({
    title: e ? 'Modifier mes gains' : 'Mes gains',
    fields: [
      { type: 'date', label: 'Jour', value: date, required: true },
      { type: 'number', label: 'Montant gagné (₪)', value: e ? e.amount : '', placeholder: 'Ex. 650', required: true },
      { type: 'number', label: 'Heures travaillées (facultatif)', value: e && e.hours ? e.hours : '', placeholder: 'Ex. 10' }
    ],
    onSave: ([d, a, h]) => {
      const amt = num(a); if (amt === null) return;
      if (!fresh && d !== date) delete state.earnings[date];
      state.earnings[d] = { amount: Math.round(amt * 100) / 100, hours: num(h) || 0 };
      ui.gMonth = d.slice(0, 7);
      toast('Gains enregistrés');
    },
    extra: e ? [{ label: 'Supprimer ce jour', cls: 'danger', fn: () => { delete state.earnings[date]; } }] : []
  });
}
function gainsHTML(today) {
  const cur = today.slice(0, 7), m = ui.gMonth || cur, st = monthStats(m), prev = monthStats(addMonths(m, -1));
  const te = state.earnings[today];
  let h = '<section id="gains"><h2>Mes gains</h2><div class="stack">';
  h += '<div class="card stack">' + (te ? '<p class="muted small">Aujourd’hui</p><p class="bignum">' + money(te.amount) + '</p>' + (te.hours ? '<p class="small muted">' + te.hours.toLocaleString('fr-FR') + ' h · ' + money(te.amount / te.hours) + ' de l’heure</p>' : '') +
    '<button class="btn block" data-act="gainEdit" data-d="' + today + '">Modifier</button>'
    : '<p><b>Combien as-tu gagné aujourd’hui ?</b></p><button class="btn primary block" data-act="gainEdit" data-d="' + today + '">Entrer mes gains d’aujourd’hui</button>') + '</div>';
  h += '<div class="card stack"><div class="monthnav"><button class="icon" data-act="gMonth" data-n="-1" aria-label="Mois précédent">‹</button><h3>' + monthLabel(m) + '</h3>' +
    '<button class="icon" data-act="gMonth" data-n="1" aria-label="Mois suivant"' + (m >= cur ? ' disabled' : '') + '>›</button></div>' +
    '<div><p class="muted small">Total du mois</p><p class="bignum">' + money(st.total) + '</p></div>';
  if (m === cur && st.days) {
    let rest = 0;
    for (let d = addDays(today, te ? 1 : 0); d.slice(0, 7) === m; d = addDays(d, 1)) { const ty = dayType(d); if (ty === 'travail' || ty === 'vendredi') rest++; }
    if (rest) h += '<p class="small muted">À ce rythme, fin du mois : environ <b style="color:var(--text)">' + money(Math.round(st.total + st.avg * rest)) + '</b> (encore ' + rest + ' jour' + (rest > 1 ? 's' : '') + ' de travail prévu' + (rest > 1 ? 's' : '') + ').</p>';
  }
  h += '<div class="kpis"><div class="kpi"><b>' + st.days + '</b><span>jour' + (st.days > 1 ? 's' : '') + ' travaillé' + (st.days > 1 ? 's' : '') + '</span></div>' +
    '<div class="kpi"><b>' + money(Math.round(st.avg)) + '</b><span>en moyenne par jour</span></div>' +
    '<div class="kpi"><b>' + (st.best ? money(st.best[1].amount) : '—') + '</b><span>meilleur jour' + (st.best ? ' (' + parse(st.best[0]).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ')' : '') + '</span></div>' +
    '<div class="kpi"><b>' + (st.perHour ? money(Math.round(st.perHour)) : '—') + '</b><span>de l’heure' + (st.perHour ? '' : ' (note tes heures)') + '</span></div></div>';
  if (prev.total) {
    const diff = st.total - prev.total;
    h += '<p class="small muted">' + monthLabel(addMonths(m, -1)) + ' : ' + money(prev.total) + ' · ' + (diff >= 0 ? '+' : '−') + money(Math.abs(diff)) + (m === cur ? ' pour l’instant' : '') + '</p>';
  }
  h += '</div>';
  h += '<div><div class="goalhead" style="margin-bottom:8px"><h3>Détail du mois</h3></div><ul class="list">';
  for (const [d, e] of st.l) h += '<li class="item"><button class="ttext" style="padding-left:12px" data-act="gainEdit" data-d="' + d + '"><span>' + longDate(d) + '</span><small class="tag">' + (e.hours ? e.hours.toLocaleString('fr-FR') + ' h · ' + money(Math.round(e.amount / e.hours)) + ' de l’heure' : 'Toucher pour modifier') + '</small></button><b style="padding-right:14px;white-space:nowrap">' + money(e.amount) + '</b></li>';
  if (!st.l.length) h += '<li class="empty">Aucun jour noté ce mois-ci.</li>';
  h += '</ul><button class="btn ghost block" style="margin-top:10px" data-act="gainEdit" data-d="' + today + '" data-other="1">Ajouter un autre jour</button></div>';
  return h + '</div></section>';
}

/* ---------- Sommeil ---------- */
const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
function sleepMins(d) { const s = state.sleep[d]; if (!s || !s.c || !s.l) return null; const v = (toMin(s.l) - toMin(s.c) + 1440) % 1440; return v > 0 ? v : null; }
const dur = m => Math.floor(m / 60) + ' h ' + pad(m % 60);
const slCls = m => m >= 420 ? 'ok' : m >= 360 ? 'warn' : 'bad';
function sleepHTML(today) {
  const s = state.sleep[today] || {}, m = sleepMins(today), y = addDays(today, -1);
  let h = '<section id="sommeil"><h2>Mon sommeil</h2><div class="card stack">' +
    '<p class="small muted">Nuit de ' + dayName(y).toLowerCase() + ' à ' + dayName(today).toLowerCase() + '</p>' +
    '<div class="two"><div><p class="fieldlabel" style="margin-bottom:6px">Couché à</p><input type="time" data-sleep="c" value="' + esc(s.c || '') + '" aria-label="Couché à"></div>' +
    '<div><p class="fieldlabel" style="margin-bottom:6px">Levé à</p><input type="time" data-sleep="l" value="' + esc(s.l || '') + '" aria-label="Levé à"></div></div>';
  h += m ? '<div><p class="bignum ' + slCls(m) + '-t">' + dur(m) + '</p><p class="small muted">' + (m >= 420 ? 'Bien dormi.' : m >= 360 ? 'Un peu court : vise au moins 7 h.' : 'Nuit courte. Ce soir, essaie de te coucher plus tôt.') + '</p></div>'
    : '<p class="small muted">Note l’heure où tu t’es couché hier soir et l’heure où tu t’es levé ce matin.</p>';
  const days = [6, 5, 4, 3, 2, 1, 0].map(i => addDays(today, -i)), vals = days.map(sleepMins);
  h += '<div class="sbars" aria-hidden="true">' + days.map((d, i) => { const v = vals[i];
    return '<div><b>' + (v ? (v / 60).toFixed(1).replace('.', ',') : '') + '</b><i class="' + (v ? (slCls(v) === 'ok' ? '' : slCls(v)) : 'none') + '" style="height:' + (v ? Math.round(Math.min(v, 600) / 600 * 90) : 3) + 'px"></i><span>' + dayName(d).slice(0, 3) + '</span></div>'; }).join('') + '</div>';
  const ok = vals.filter(v => v);
  h += '<p class="small muted">' + (ok.length ? 'Moyenne sur 7 jours : ' + dur(Math.round(ok.reduce((a, b) => a + b, 0) / ok.length)) + ' · objectif 7 à 8 h' : 'Objectif : 7 à 8 h par nuit.') + '</p>';
  return h + '</div></section>';
}

    '<p class="fieldlabel">Premier enfant</p><input type="text" id="kid0" value="' + esc(state.kids[0] || '') + '" placeholder="Prénom">' +

    '<button class="btn block" data-act="saveKids">Enregistrer les prénoms</button>');

  h += det('backup', 'Sauvegarde', '<p class="small muted">Tes données sont seulement sur ce téléphone. Fais une sauvegarde de temps en temps et garde le fichier (Drive, WhatsApp à toi-même…).</p><p class="small">' + last + '</p>' +

function shabbatHTML(sh) {
  return '<section class="card shabbat"><h2>Shabbat Shalom</h2><p class="muted">Aucune proposition jusqu’à la fin de Shabbat' + (sh.end ? ', vers ' + hm(sh.end) : '') + '.</p>' +
    '<button class="linkbtn" data-act="showAnyway">Afficher la page quand même</button></section>';
}

let lastKey = '';
function render() {
  applyNight();
  const t = now(), today = ymd(t), tom = nextPlan(today);
  const sh = shabbatNow(t);
  if (!sh.active) ui.showShabbat = false;
  refreshPlans(today); refreshPlans(tom);
  const evening = t.getHours() >= 18;
  // garder ce qui est en train d'être tapé
  const typed = {}; document.querySelectorAll('#app input[type=text], #app textarea').forEach(i => { if (i.value) typed[i.id] = i.value; });
  const focused = document.activeElement && document.activeElement.id;
  const tab = TABS.some(x => x[0] === state.settings.tab) ? state.settings.tab : 'jour';
  const blocked = sh.active && !ui.showShabbat;
  let h = '';
  if (blocked) h = headerHTML(t, today, sh) + shabbatHTML(sh);
  else if (tab === 'jour') h = headerHTML(t, today, sh) + (evening ? demainHTML(tom) : '') + gainReminderHTML(today, evening) +
    tasksHTML(today, tom, evening) + habitsHTML(today) + sleepHTML(today) + skillLineHTML(today) + ideasHTML(today);
  else if (tab === 'objectifs') h = goalsHTML(today) + skillHTML(today);
  else if (tab === 'famille') h = famHTML(today);
  else if (tab === 'gains') h = gainsHTML(today);
  else h = settingsHTML();
  $('#app').innerHTML = h;
  $('#tabs').innerHTML = tabsHTML(tab);
  $('#tabs').hidden = blocked;
  for (const id in typed) { const i = document.getElementById(id); if (i) i.value = typed[id]; }
  if (focused && typed[focused] !== undefined) { const i = document.getElementById(focused); if (i) i.focus(); }
  $('#fab').hidden = blocked || tab === 'reglages';
  $('#fab').setAttribute('aria-label', tab === 'gains' ? 'Ajouter des gains' : 'Ajouter une tâche');
  lastKey = today + '|' + t.getHours() + '|' + sh.active;
  save();
}

function applyNight() {
  const n = state.settings.night, hr = now().getHours();
  const on = n === 'on' || (n === 'auto' && (hr >= 21 || hr < 6));
  if (on) document.documentElement.dataset.night = '1'; else delete document.documentElement.dataset.night;
  const m = document.querySelector('meta[name=theme-color]');
  if (m) m.content = on ? '#0a0706' : '#1e2124';
}

/* ---------- Message « Bien joué » ---------- */
let toastTimer, toastUndoFn = null;
function toast(msg, undo) {
  const el = $('#toast'); $('#toastMsg').textContent = msg;
  toastUndoFn = undo || null;
  $('#toastUndo').hidden = !undo; el.classList.toggle('has-undo', !!undo);
  el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), undo ? 5000 : 1600);
}
$('#toastUndo').addEventListener('click', () => { if (toastUndoFn) { toastUndoFn(); toastUndoFn = null; render(); } $('#toast').classList.remove('show'); });
const bravo = () => toast('✓ Bien joué');

/* ---------- Fenêtre de saisie (en bas de l'écran) ---------- */
function sheet({ title, fields, onSave, extra = [] }) {
  const d = $('#dlg');
  let h = '<form class="sheet" method="dialog"><h2 style="margin:0">' + esc(title) + '</h2>';
  fields.forEach((f, i) => {
    h += '<div>' + (f.label ? '<label for="f' + i + '">' + esc(f.label) + '</label>' : '');
    if (f.type === 'text') h += '<input type="text" id="f' + i + '" value="' + esc(f.value || '') + '" placeholder="' + esc(f.placeholder || '') + '" autocomplete="off" enterkeyhint="done">';
    else if (f.type === 'number') h += '<input type="number" inputmode="decimal" step="any" min="0" id="f' + i + '" value="' + esc(f.value ?? '') + '" placeholder="' + esc(f.placeholder || '') + '">';
    else if (f.type === 'date') h += '<input type="date" id="f' + i + '" value="' + esc(f.value || '') + '" max="' + todayStr() + '">';
    else h += '<div class="seg" data-field="' + i + '">' + f.options.map(([v, l]) => '<button type="button" data-v="' + esc(v) + '" aria-pressed="' + (f.value === v) + '">' + esc(l) + '</button>').join('') + '</div>';
    h += '</div>';
  });
  h += '<div class="actions"><button type="button" class="btn ghost" data-x="cancel">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div>';
  extra.forEach((e, i) => { h += '<button type="button" class="btn ' + (e.cls || 'ghost') + ' block" data-x="e' + i + '">' + e.label + '</button>'; });
  d.innerHTML = h + '</form>';
  const vals = fields.map(f => f.value);
  d.querySelectorAll('.seg').forEach(s => s.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const i = +s.dataset.field; vals[i] = b.dataset.v;
    s.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  }));
  d.querySelector('form').addEventListener('submit', e => {
    e.preventDefault();
    fields.forEach((f, i) => { if (f.type !== 'seg') vals[i] = d.querySelector('#f' + i).value.trim(); });
    const miss = fields.findIndex((f, i) => f.required && !vals[i]);
    if (miss >= 0) { d.querySelector('#f' + miss).focus(); return; }
    if (fields[0].type === 'text' && !vals[0]) { d.querySelector('#f0').focus(); return; }
    d.close(); onSave(vals); render();
  });
  d.querySelectorAll('[data-x]').forEach(b => b.addEventListener('click', () => {
    const x = b.dataset.x; d.close();
    if (x !== 'cancel') { extra[+x.slice(1)].fn(); render(); }
  }));
  d.showModal();
  const first = d.querySelector('input'); if (first && !fields[0].value) setTimeout(() => first.focus(), 50);
}

function weekSheet() {
  const d = $('#dlg');
  const draw = () => {
    const today = todayStr();
    let h = '<div class="sheet"><h2 style="margin:0">Ma semaine</h2><p class="small muted">Choisis le type de chaque jour. Les propositions s’adaptent.</p><div>';
    for (let i = 0; i < 7; i++) {
      const s = addDays(today, i), ty = dayType(s);
      h += '<div class="dayrow"><b>' + (i === 0 ? 'Aujourd’hui' : i === 1 ? 'Demain' : dayName(s)) + ' <span class="muted small">· ' + parse(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }) + (state.dayOverrides[s] ? ' · modifié' : '') + '</span></b>';
      if (ty === 'shabbat') h += '<span class="muted">Shabbat</span>';
      else h += '<div class="seg">' + [['travail', 'Travail'], ['conge', 'Congé'], ['vendredi', 'Court']].map(([v, l]) => '<button data-date="' + s + '" data-v="' + v + '" aria-pressed="' + (ty === v) + '">' + l + '</button>').join('') + '</div>';
      h += '</div>';
    }
    h += '</div><button class="btn primary block" data-x="close">Terminé</button></div>';
    d.innerHTML = h;
  };
  draw();
  d.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.x === 'close') { d.close(); return; }
    if (b.dataset.date) {
      const s = b.dataset.date;
      if (b.dataset.v === defaultType(s)) delete state.dayOverrides[s]; else state.dayOverrides[s] = b.dataset.v;
      render(); draw();
    }
  };
  d.addEventListener('close', () => { d.onclick = null; }, { once: true });
  d.showModal();
}

/* ---------- Actions ---------- */
const findTask = id => state.tasks.find(t => t.id === id);
const goalOf = id => state.goals.find(g => g.id === id);
function setTaskDone(t, done) {
  t.done = done; t.auto = t.auto && !done ? t.auto : false;
  if (t.stepId) { const g = goalOf(t.goalId); const s = g && g.steps.find(x => x.id === t.stepId); if (s) s.done = done; }
}
function taskSheet(t) {
  const today = todayStr(), tom = nextPlan(today);
  const tomLabel = tom === addDays(today, 1) ? 'Demain' : dayName(tom);
  const dates = [[today, 'Aujourd’hui'], [tom, tomLabel]];
  if (t && !dates.some(d => d[0] === t.date)) dates.push([t.date, longDate(t.date)]);
  sheet({
    title: t ? 'Modifier la tâche' : 'Nouvelle tâche',
    fields: [
      { type: 'text', label: 'Tâche', value: t ? t.text : '', placeholder: 'Ex. : appeler le garage' },
      { type: 'seg', label: 'Pour quand ?', value: t ? t.date : today, options: dates },
      { type: 'seg', label: 'Thème (facultatif)', value: t ? (t.theme || '') : '', options: [['', 'Aucun']].concat(THEMES) }
    ],
    onSave: ([text, date, theme]) => {
      if (t) { if (t.text !== text || t.date !== date) t.auto = false; t.text = text; t.date = date; t.theme = theme || null; }
      else state.tasks.push({ id: uid(), date, text, theme: theme || null, source: 'user', auto: false, done: false });
      if (!t) toast(date === today ? 'Ajoutée à aujourd’hui' : 'Ajoutée à ' + tomLabel.toLowerCase());
    },
    extra: t ? [{ label: 'Supprimer la tâche', cls: 'danger', fn: () => delTask(t.id) }] : []
  });
}
function delTask(id) {
  const i = state.tasks.findIndex(t => t.id === id); if (i < 0) return;
  const [t] = state.tasks.splice(i, 1);
  toast('Tâche supprimée', () => state.tasks.splice(i, 0, t));
}
function exportData(share) {
  const data = JSON.stringify(Object.assign({ app: 'tableau-perso', exportedAt: new Date().toISOString() }, state), null, 2);
  const name = 'tableau-sauvegarde-' + todayStr() + '.json';
  const file = new File([data], name, { type: 'application/json' });
  state.lastExport = Date.now(); save();
  if (share && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: 'Sauvegarde tableau de bord' }).catch(() => { });
  } else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Sauvegarde téléchargée');
  }
  render();
}
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || !Array.isArray(o.tasks) || !o.bank || !Array.isArray(o.goals)) throw new Error('format');
      if (!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')) return;
      delete o.app; delete o.exportedAt;
      state = normalize(o); save(); render(); toast('Sauvegarde importée');
    } catch (err) { alert('Ce fichier n’est pas une sauvegarde valide.'); }
  };
  r.readAsText(f);
});

const ACTS = {
  addTask: () => { if (state.settings.tab === 'gains') { const t = todayStr(); return state.earnings[t] ? gainSheet(addDays(t, -1), true) : gainSheet(t); } taskSheet(null); },
  editTask: el => { const t = findTask(el.dataset.id); if (t) taskSheet(t); },
  toggleTask: el => { const t = findTask(el.dataset.id); if (!t) return; setTaskDone(t, !t.done); if (t.done) bravo(); },
  delTask: el => delTask(el.dataset.id),
  postpone: el => { const t = findTask(el.dataset.id); if (!t) return; const old = t.date, oldAuto = t.auto; t.date = nextPlan(todayStr()); t.auto = false; toast('Reportée', () => { t.date = old; t.auto = oldAuto; }); },
  postponeAll: () => {
    const today = todayStr(), tom = nextPlan(today);
    const l = state.tasks.filter(t => t.date === today && !t.done);
    const prev = l.map(t => [t, t.auto]);
    l.forEach(t => { t.date = tom; t.auto = false; });
    toast(l.length + ' tâche' + (l.length > 1 ? 's' : '') + ' reportée' + (l.length > 1 ? 's' : ''), () => prev.forEach(([t, a]) => { t.date = today; t.auto = a; }));
  },
  bringOverdue: () => { const today = todayStr(); state.tasks.forEach(t => { if (t.date < today && !t.done && !t.auto) t.date = today; }); },
  toggleTomorrow: () => { ui.showTomorrow = !ui.showTomorrow; },
  openWeek: () => weekSheet(),
  refreshWeather: () => { fetchWeather(true); toast('Météo en cours d’actualisation…'); },
  showAnyway: () => { ui.showShabbat = true; },
  doToday: el => {
    const g = goalOf(el.dataset.goal), today = todayStr();
    const s = g && g.steps.find(x => !x.done); if (!s) return;
    if (state.tasks.some(t => t.stepId === s.id && t.date === today && !t.done)) { toast('Déjà dans tes tâches du jour'); return; }
    state.tasks = state.tasks.filter(t => !(t.date === today && t.auto && !t.done && t.theme === g.id && t.source === 'suggest'));
    state.tasks.forEach(t => { if (t.stepId === s.id && !t.done) t.date = today; });
    if (!state.tasks.some(t => t.stepId === s.id && t.date === today))
      state.tasks.push({ id: uid(), date: today, text: s.text, theme: g.id, source: 'goal', goalId: g.id, stepId: s.id, auto: false, done: false });
    toast('Ajoutée à tes tâches du jour');
  },
  toggleStep: el => {
    const g = goalOf(el.dataset.goal), s = g && g.steps.find(x => x.id === el.dataset.id); if (!s) return;
    s.done = !s.done;
    state.tasks.forEach(t => { if (t.stepId === s.id && t.date >= todayStr()) { t.done = s.done; if (s.done) t.auto = false; } });
    if (s.done) bravo();
  },
  editStep: el => {
    const g = goalOf(el.dataset.goal), i = g.steps.findIndex(x => x.id === el.dataset.id), s = g.steps[i]; if (!s) return;
    const move = d => { const j = i + d; if (j < 0 || j >= g.steps.length) return; g.steps.splice(i, 1); g.steps.splice(j, 0, s); };
    sheet({
      title: 'Modifier l’étape', fields: [
        { type: 'text', label: 'Étape', value: s.text },
        { type: 'seg', label: 'Durée', value: s.len, options: [['court', 'Courte (10–15 min)'], ['long', 'Longue']] }
      ],
      onSave: ([text, len]) => { s.text = text; s.len = len; state.tasks.forEach(t => { if (t.stepId === s.id) t.text = text; }); },
      extra: [{ label: 'Monter dans la liste', fn: () => move(-1) }, { label: 'Descendre dans la liste', fn: () => move(1) },
      { label: 'Supprimer l’étape', cls: 'danger', fn: () => ACTS.delStep(el) }]
    });
  },
  delStep: el => {
    const g = goalOf(el.dataset.goal), i = g.steps.findIndex(x => x.id === el.dataset.id); if (i < 0) return;
    const [s] = g.steps.splice(i, 1);
    toast('Étape supprimée', () => g.steps.splice(i, 0, s));
  },
  addStep: el => {
    const g = goalOf(el.dataset.goal), inp = document.getElementById('addstep-' + g.id);
    const text = inp && inp.value.trim(); if (!text) { inp && inp.focus(); return; }
    g.steps.push({ id: uid(), text, len: el.dataset.len, done: false }); inp.value = '';
    toast('Étape ajoutée');
  },
  renameGoal: el => { const g = goalOf(el.dataset.goal); sheet({ title: 'Renommer l’objectif', fields: [{ type: 'text', label: 'Nom', value: g.name }], onSave: ([v]) => { g.name = v; } }); },
  toggleHabit: el => {
    const d = todayStr(); const log = state.habitLog[d] = state.habitLog[d] || {};
    const hb = state.habits.find(x => x.id === el.dataset.id);
    const c = state.counts[d] = state.counts[d] || {};
    if (log[el.dataset.id]) { delete log[el.dataset.id]; if (hb && hb.goal) delete c[hb.id]; }
    else { log[el.dataset.id] = true; if (hb && hb.goal) c[hb.id] = Math.max(countOf(d, hb.id), hb.goal); bravo(); }
  },
  addCount: el => {
    const d = todayStr(), hb = state.habits.find(x => x.id === el.dataset.id); if (!hb) return;
    const before = countOf(d, hb.id), v = Math.max(0, before + (+el.dataset.n));

    const log = state.habitLog[d] = state.habitLog[d] || {};

    if (before < hb.goal && v >= hb.goal) bravo();
  },
  famToggle: el => {

  },
  skillMove: el => { state.skill.offset += +el.dataset.n; },
  saveKids: () => { state.kids = [$('#kid0').value.trim(), $('#kid1').value.trim()]; $('#kid0').value = ''; $('#kid1').value = ''; toast('Prénoms enregistrés'); },
  editHabit: el => { const h = state.habits.find(x => x.id === el.dataset.id); sheet({ title: 'Renommer l’habitude', fields: [{ type: 'text', label: 'Habitude', value: h.name }], onSave: ([v]) => { h.name = v; } }); },
  delHabit: el => { const i = state.habits.findIndex(x => x.id === el.dataset.id); const [h] = state.habits.splice(i, 1); toast('Habitude supprimée', () => state.habits.splice(i, 0, h)); },
  addHabit: () => { const inp = $('#addhabit'), v = inp.value.trim(); if (!v) { inp.focus(); return; } state.habits.push({ id: uid(), name: v }); inp.value = ''; toast('Habitude ajoutée'); },
  ideaDone: el => { const it = state.ideas[todayStr()][el.dataset.th]; it.status = 'done'; bravo(); },
  ideaUndo: el => {
    const today = todayStr(), th = el.dataset.th, it = state.ideas[today][th];
    if (it.status === 'tomorrow') {
      const td = nextPlan(today), tom = state.ideas[td];

  ideaOther: el => {

  setNight: el => { state.settings.night = el.dataset.v; },

};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.closest('dialog')) return;
  const fn = ACTS[el.dataset.act]; if (!fn) return;
  const before = JSON.stringify(state);
  fn(el);
  if (!$('#dlg').open || JSON.stringify(state) !== before) render();
});
// Touche « Entrée » dans les champs d'ajout
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('#app input[type=text]')) return;
  e.preventDefault();
  const id = e.target.id;
  if (id === 'addhabit') { ACTS.addHabit(); render(); }
  else if (id === 'addbank') { ACTS.addBank({ dataset: { len: 'court' } }); render(); }
  else if (id.startsWith('addstep-')) { ACTS.addStep({ dataset: { goal: id.slice(8), len: 'long' } }); render(); }
});
document.addEventListener('input', e => {
  const t = e.target, d = todayStr();
  if (t.dataset.famnote) {
    const id = t.dataset.famnote, st = famStore('d', d);
    st[id + '_txt'] = t.value;
    if (t.value.trim() && !st[id]) { st[id] = true; const b = document.querySelector('[data-act=famToggle][data-id="' + id + '"]'); if (b) { b.setAttribute('aria-pressed', 'true'); b.closest('.item').classList.add('done'); } }
    save();
  } else if (t.dataset.fambilan) {
    const st = famStore('w', d); st.bilan_txt = st.bilan_txt || {}; st.bilan_txt[t.dataset.fambilan] = t.value;
    if (t.value.trim()) st.bilan = true;
    save();
  }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset || !t.dataset.sleep) return;
  const d = todayStr(), s = state.sleep[d] = state.sleep[d] || {};
  s[t.dataset.sleep] = t.value; render();
});
document.addEventListener('toggle', e => { if (e.target.dataset && e.target.dataset.key) ui.open[e.target.dataset.key] = e.target.open; }, true);

/* ---------- Démarrage ---------- */
prune();
render();
fetchWeather(false);
setInterval(() => {
  const t = now(); const key = ymd(t) + '|' + t.getHours() + '|' + shabbatNow(t).active;
  if (key !== lastKey && !$('#dlg').open) render();
  if (!weather || Date.now() - weather.fetchedAt > 60 * 60000) fetchWeather(false);
}, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (!$('#dlg').open) render(); fetchWeather(false); } });
window.addEventListener('online', () => fetchWeather(true));
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
